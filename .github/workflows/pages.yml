name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/ingest_webcams.py"
      - "backend/webcam_sources.json"
      - "backend/tests/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Update snow observation", "Weather forecasts", "Snow model"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test webcam catalog
        run: python -m unittest discover -s backend/tests -v

      - name: Restore the latest products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Walks back through recent successful runs until one still has its artifact.
          restore() {
            for run_id in $(gh run list --workflow "$1" --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              rm -rf "$3"
              if gh run download "$run_id" --name "${2/RUN_ID/$run_id}" --dir "$3" 2>/dev/null; then
                echo "Restored $1 run $run_id"
                return 0
              fi
            done
            rm -rf "$3"
            echo "::warning::No usable artifact from $1; publishing without it"
            return 0
          }
          restore snow-observation.yml "snow-observation-RUN_ID" observation-artifact
          restore weather-forecasts.yml "weather-forecasts" weather-artifact
          restore snow-model.yml "snow-model" snow-artifact
          if [ -d observation-artifact ]; then
            mkdir -p frontend/public/data/observations/latest
            cp observation-artifact/manifest.json observation-artifact/snow_cover.png frontend/public/data/observations/latest/
          fi
          if [ -d weather-artifact ]; then
            rm -rf frontend/public/weather
            cp -R weather-artifact frontend/public/weather
          fi
          if [ -d snow-artifact ]; then
            rm -rf frontend/public/data/snow-model
            cp -R snow-artifact frontend/public/data/snow-model
          fi

      - name: Refresh webcam catalog
        continue-on-error: true
        run: python backend/ingest_webcams.py

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Validate static artifact
        run: |
          test -f frontend/dist/index.html
          for f in data/webcams.json data/basins.geojson weather/manifest.json data/snow-model/manifest.json; do
            python -m json.tool "frontend/dist/$f" >/dev/null
          done
          if [ -f frontend/dist/data/observations/latest/manifest.json ]; then
            python -m json.tool frontend/dist/data/observations/latest/manifest.json >/dev/null
            test -f frontend/dist/data/observations/latest/snow_cover.png
          fi
          python - <<'EOF'
          import json
          from pathlib import Path
          root = Path("frontend/dist/data/snow-model")
          manifest = json.loads((root / "manifest.json").read_text())
          for layer in manifest["layers"].values():
              assert (root / layer["image"]).is_file(), layer["image"]
          for basin in manifest["basins"]:
              if "series" in basin:
                  json.loads((root / basin["series"]).read_text())
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled workflow failed: ${{ github.workflow }}"
          body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
