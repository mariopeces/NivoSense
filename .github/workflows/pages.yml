name: Publish site

# The live site's code comes only from a release: a tag vMAJOR.MINOR.PATCH on a
# main commit (scripts/pick_release.py). Every run deploys the newest release with
# fresh data. Pages serves one artifact, so a data refresh is a redeploy of the same
# tagged code. There is deliberately no tag trigger: a tag-push run would execute
# the workflow file of the tagged commit, which may be unmerged code. Only runs on
# main (also enforced by the github-pages environment) can deploy.
on:
  workflow_run:
    workflows: ["Update snow observation", "Weather forecasts", "Snow model"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # workflow_run also fires for fork pull requests from a branch named main; only
    # successful scheduled or dispatched producer runs of this repository count.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      ignored_tags: ${{ steps.release.outputs.ignored_tags }}
    steps:
      - name: Only main deploys the live site
        run: test "$GITHUB_REF" = refs/heads/main
      # Full history and tags, so the picker can check that a release tag is on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the release
        id: release
        run: |
          status=0
          tag=$(python3 scripts/pick_release.py --main-ref refs/remotes/origin/main 2> pick.log) || status=$?
          cat pick.log >&2
          if grep -q '^::warning::' pick.log; then echo "ignored_tags=true" >> "$GITHUB_OUTPUT"; fi
          test "$status" = 0
          echo "Deploying release $tag ($(git rev-parse "refs/tags/$tag^{commit}"))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        # The release tree may predate scripts/trusted_runs.py, so keep main's copy.
        run: |
          cp scripts/trusted_runs.py "$RUNNER_TEMP/"
          git checkout --detach "refs/tags/$TAG"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test webcam catalog
        run: python -m unittest discover -s backend/tests -v

      - name: Restore the latest products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Walks back through recent trusted runs (scripts/trusted_runs.py) until one
          # still has its artifact.
          # Each trusted event is queried on its own, so a flood of other runs cannot push
          # trusted ones off the first page. An API error fails the step: publishing
          # without the layer would silently drop it from the live site.
          set -o pipefail
          restore() {
            local runs event
            for event in schedule workflow_dispatch; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?branch=main&status=success&event=$event&per_page=30" \
                > "runs-$event.json"
            done
            runs=$(python3 "$RUNNER_TEMP/trusted_runs.py" runs-schedule.json runs-workflow_dispatch.json \
              --repo "$GITHUB_REPOSITORY" --workflow-path ".github/workflows/$1")
            for run_id in $runs; do
              rm -rf "$3"
              if gh run download "$run_id" --name "${2/RUN_ID/$run_id}" --dir "$3" 2>/dev/null; then
                echo "Restored $1 run $run_id"
                return 0
              fi
            done
            rm -rf "$3"
            echo "::warning::No usable artifact from $1; publishing without it"
            return 0
          }
          restore snow-observation.yml "snow-observation-RUN_ID" observation-artifact
          restore weather-forecasts.yml "weather-forecasts" weather-artifact
          restore snow-model.yml "snow-model" snow-artifact
          if [ -d observation-artifact ]; then
            mkdir -p frontend/public/data/observations/latest
            cp observation-artifact/manifest.json observation-artifact/snow_cover.png frontend/public/data/observations/latest/
          fi
          if [ -d weather-artifact ]; then
            rm -rf frontend/public/weather
            cp -R weather-artifact frontend/public/weather
          fi
          if [ -d snow-artifact ]; then
            rm -rf frontend/public/data/snow-model
            cp -R snow-artifact frontend/public/data/snow-model
          fi

      - name: Refresh webcam catalog
        continue-on-error: true
        run: python backend/ingest_webcams.py

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Validate static artifact
        run: |
          test -f frontend/dist/index.html
          for f in data/webcams.json data/basins.geojson weather/manifest.json data/snow-model/manifest.json; do
            python -m json.tool "frontend/dist/$f" >/dev/null
          done
          if [ -f frontend/dist/data/observations/latest/manifest.json ]; then
            python -m json.tool frontend/dist/data/observations/latest/manifest.json >/dev/null
            test -f frontend/dist/data/observations/latest/snow_cover.png
          fi
          python - <<'EOF'
          import json
          from pathlib import Path
          root = Path("frontend/dist/data/snow-model")
          manifest = json.loads((root / "manifest.json").read_text())
          for layer in manifest["layers"].values():
              assert (root / layer["image"]).is_file(), layer["image"]
          for basin in manifest["basins"]:
              if "series" in basin:
                  json.loads((root / basin["series"]).read_text())
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A separate job, so a run the github-pages environment refuses is reported too.
  report:
    needs: publish
    if: always() && (needs.publish.result == 'failure' || needs.publish.outputs.ignored_tags == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ needs.publish.result == 'failure' }}
        run: |
          if [ "$FAILED" = true ]; then
            title="Workflow failed: ${{ github.workflow }}"
          else
            title="Release tags ignored: ${{ github.workflow }}"
          fi
          body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
