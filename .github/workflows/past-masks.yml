name: Past seasons snow masks

# Task T1.7: the observed snow masks of past seasons into the staging bucket's _cache/snow_obs/ (outside the
# catalogue) for the forcing study and the calibration. One job per month; a month that already ran with the
# same input keys and code only reads its entries back, so a failed or cancelled run is resumed by running it
# again. The domain comes from data/domain.geojson at `domain_ref` and is part of every cache key.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "first date, YYYY-MM-DD"
        type: string
        default: "2023-09-01"
      end:
        description: "last date, YYYY-MM-DD"
        type: string
        default: "2025-09-30"
      domain_ref:
        description: "git ref that holds data/domain.geojson"
        type: string
        default: main

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: past-masks
  cancel-in-progress: false

env:
  START: ${{ inputs.start || '2023-09-01' }}
  END: ${{ inputs.end || '2025-09-30' }}
  DOMAIN_REF: ${{ inputs.domain_ref || 'main' }}
  STAGING_BUCKET: ${{ vars.STAGING_BUCKET }}
  STAGING_PREFIX: ${{ vars.STAGING_PREFIX }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      months: ${{ steps.months.outputs.months }}
    steps:
      - id: months
        shell: python
        run: |
          import datetime as dt, json, os
          start, end = dt.date.fromisoformat(os.environ["START"]), dt.date.fromisoformat(os.environ["END"])
          assert start <= end, "end is before start"
          months, first = [], start
          while first <= end:
              following = (first.replace(day=1) + dt.timedelta(days=32)).replace(day=1)
              months.append({"start": first.isoformat(), "end": min(end, following - dt.timedelta(days=1)).isoformat()})
              first = following
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"months={json.dumps(months)}", file=out)

  month:
    needs: plan
    runs-on: ubuntu-24.04
    # About 6 full passes and 6 one-tile passes a month at up to 5 minutes each.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - name: Domain
        run: |
          git fetch --depth 1 origin "$DOMAIN_REF"
          git show FETCH_HEAD:data/domain.geojson > "$RUNNER_TEMP/domain.geojson"
          sha256sum "$RUNNER_TEMP/domain.geojson"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/requirements.lock
      - run: pip install --require-hashes -r pipelines/requirements.lock
      - name: Authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_STAGING }}
      - name: Ingest, classify and cache
        run: |
          python -m pipelines.snow_obs.cache month --domain "$RUNNER_TEMP/domain.geojson" \
            --start "${{ matrix.month.start }}" --end "${{ matrix.month.end }}" \
            --work "$RUNNER_TEMP/work" --static-cache "$RUNNER_TEMP/static"

  manifest:
    needs: month
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/requirements.lock
      - run: pip install --require-hashes -r pipelines/requirements.lock
      - name: Authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_STAGING }}
      - name: Manifest
        run: |
          python -m pipelines.snow_obs.cache manifest --start "$START" --end "$END" | tee -a "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: [month, manifest]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Workflow failed: ${{ github.workflow }}"
          body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
