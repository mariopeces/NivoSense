name: Catalog

# The serialised catalogue steps. Pipelines call this after publish() to rebuild the index; promote copies a
# validated date range from staging to prod and runs only on main, where the prod writer can be used.
on:
  workflow_call:
    inputs:
      action:
        description: "rebuild-index or promote"
        type: string
        required: true
      target:
        description: "staging or prod (rebuild-index only)"
        type: string
        default: staging
      start:
        type: string
        default: ""
      end:
        type: string
        default: ""
      layers:
        description: "space-separated layer ids to promote; empty for all"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [rebuild-index, promote]
        default: rebuild-index
      target:
        description: "rebuild-index only"
        type: choice
        options: [staging, prod]
        default: staging
      start:
        description: "promote: first date, YYYY-MM-DD"
        type: string
        default: ""
      end:
        description: "promote: last date, YYYY-MM-DD"
        type: string
        default: ""
      layers:
        description: "promote: space-separated layer ids; empty for all"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub keeps a single pending run per group and cancels the older one. That is harmless for rebuilds of
    # one catalogue (the newer run reads every entry), so they share catalog-staging or catalog-prod. A cancelled
    # promote would silently drop its date range, so each promote gets a group of its own: promotes may then run
    # side by side, which is safe because files are content-addressed, entries are per date and the prod index
    # write is conditional on its generation. That condition, not the group, is what keeps the index whole.
    concurrency:
      group: catalog-${{ inputs.action == 'promote' && format('promote-{0}', github.run_id) || inputs.target }}
      cancel-in-progress: false
    env:
      ACTION: ${{ inputs.action }}
      TARGET: ${{ inputs.target }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      LAYERS: ${{ inputs.layers }}
      STAGING_BUCKET: ${{ vars.STAGING_BUCKET }}
      STAGING_PREFIX: ${{ vars.STAGING_PREFIX }}
      DATA_BUCKET: ${{ vars.DATA_BUCKET }}
      DATA_PREFIX: ${{ vars.DATA_PREFIX }}
    steps:
      - name: Check the inputs
        run: |
          case "$ACTION" in
            rebuild-index) [ "$TARGET" = staging ] || [ "$TARGET" = prod ] ;;
            promote) [ -n "$START" ] && [ -n "$END" ] ;;
            *) false ;;
          esac || { echo "bad inputs: action=$ACTION target=$TARGET start=$START end=$END"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/requirements.lock
      - run: pip install --require-hashes -r pipelines/requirements.lock

      # The prod writer can be impersonated only from refs/heads/main (Workload Identity Federation condition).
      - name: Authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ (inputs.action == 'promote' || inputs.target == 'prod') && vars.GCP_SA_PROD || vars.GCP_SA_STAGING }}

      - name: Rebuild the index
        if: inputs.action == 'rebuild-index'
        run: python -m pipelines.catalog rebuild-index --target "$TARGET"

      - name: Promote staging to prod
        if: inputs.action == 'promote'
        run: |
          args=(--start "$START" --end "$END")
          for layer in $LAYERS; do args+=(--layer "$layer"); done
          python -m pipelines.catalog promote "${args[@]}"

      - name: Report a failed run
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Scheduled workflow failed: ${{ github.workflow }}"
          body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
