name: Snow model catalogue

# Retired v1 (docs/snow-evaluation.md): manual runs only, the schedule moved to snow-model-v2.yml.
# SWE and snow depth, published to the catalogue from the model state stored under state/<date>.npz.
# Daily run (prod): the last 6 days, so an observation that arrived late is inserted and the days after it are
# recomputed from the state of the day before. Manual run: any range and target; a range that starts on 1 October
# starts the season from zero, any other start needs the state of the day before. Seasons run serially.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date, YYYY-MM-DD"
        type: string
        required: true
      end:
        description: "Last date, YYYY-MM-DD"
        type: string
        required: true
      target:
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: snow-model-catalogue-${{ inputs.target || 'prod' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || 'prod' }}
      STAGING_BUCKET: ${{ vars.STAGING_BUCKET }}
      STAGING_PREFIX: ${{ vars.STAGING_PREFIX }}
      DATA_BUCKET: ${{ vars.DATA_BUCKET }}
      DATA_PREFIX: ${{ vars.DATA_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/requirements.lock
      - run: pip install --require-hashes -r pipelines/requirements.lock

      - name: Work out the range
        id: range
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
          else
            echo "start=$(date -u -d '6 days ago' +%F)" >> "$GITHUB_OUTPUT"
            echo "end=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.TARGET == 'prod' && vars.GCP_SA_PROD || vars.GCP_SA_STAGING }}

      - name: Model SWE and snow depth
        run: >-
          python -m pipelines.snow_model.daily
          --start "${{ steps.range.outputs.start }}" --end "${{ steps.range.outputs.end }}"
          --target "$TARGET" --cache snow-cache

      - name: Rebuild the catalogue index
        run: python -m pipelines.catalog rebuild-index --target "$TARGET"

      - name: Report a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled workflow failed: ${{ github.workflow }}"
          body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
