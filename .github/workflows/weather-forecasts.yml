name: Weather forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,11,17,23 * * *"

permissions:
  contents: read

concurrency:
  group: weather-forecasts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/weather_forecasts/requirements.txt
      - run: pip install -r pipelines/weather_forecasts/requirements.txt
      - run: python -m unittest discover -s tests/weather_forecasts -v
      - run: python -m pipelines.weather_forecasts.run --output weather-output
      - run: |
          rm -rf frontend/public/weather
          cp -R weather-output frontend/public/weather
          npm ci --prefix frontend
          npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: weather-forecasts
          path: weather-output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nivosense-site-with-weather
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
