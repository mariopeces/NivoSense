name: Weather forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,11,17,23 * * *"

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: weather-forecasts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/requirements.lock
      - run: pip install --require-hashes -r pipelines/requirements.lock
      - run: python -m unittest discover -s tests/weather_forecasts -v
      # WeatherNext 3 needs an allowlisted identity (docs/weathernext.md). Without it the step fails, the run
      # logs a warning and publishes the other model; the site lists WeatherNext only once it is in the manifest.
      - name: Authenticate to Google Cloud
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_PROD }}
      - run: python -m pipelines.weather_forecasts.run --output weather-output
      - uses: actions/upload-artifact@v4
        with:
          name: weather-forecasts
          path: weather-output/
          if-no-files-found: error
          retention-days: 14

      - name: Report a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled workflow failed: ${{ github.workflow }}"
          body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
