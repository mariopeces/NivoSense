name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipelines/requirements-dev.lock
      - id: install
        run: pip install --require-hashes -r pipelines/requirements-dev.lock
      - name: Ruff
        # Each check runs even if an earlier one failed, so one run reports every failure.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check --output-format=github .
      - name: Mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy
      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: install
        run: npm ci
      - name: Typecheck
        # Each check runs even if an earlier one failed, so one run reports every failure.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
