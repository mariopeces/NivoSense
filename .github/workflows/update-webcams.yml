name: Update webcam catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-webcam-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test parser
        run: python -m unittest discover -s backend/tests
      - name: Generate catalog
        run: python backend/ingest_webcams.py
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- frontend/public/data/webcams.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/webcams.json
          git commit -m "Update webcam catalog"
          git push
