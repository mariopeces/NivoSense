name: Update snow observation

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-gfsc:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test observation pipeline
        run: python -m unittest tests.test_fetch_snow_observation -v
      - name: Check Copernicus credentials
        env:
          GFSC_ACCESS_TOKEN: ${{ secrets.GFSC_ACCESS_TOKEN }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          if [ -z "$GFSC_ACCESS_TOKEN" ] && { [ -z "$CDSE_CLIENT_ID" ] || [ -z "$CDSE_CLIENT_SECRET" ]; }; then
            echo "Missing credentials: configure GFSC_ACCESS_TOKEN or CDSE_CLIENT_ID and CDSE_CLIENT_SECRET" >&2
            exit 1
          fi
      - name: Fetch latest GFSC observation
        env:
          GFSC_ACCESS_TOKEN: ${{ secrets.GFSC_ACCESS_TOKEN }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          GFSC_CATALOG_ENDPOINT: ${{ vars.GFSC_CATALOG_ENDPOINT }}
          GFSC_PROCESS_ENDPOINT: ${{ vars.GFSC_PROCESS_ENDPOINT }}
          GFSC_TOKEN_ENDPOINT: ${{ vars.GFSC_TOKEN_ENDPOINT }}
          GFSC_COLLECTION: ${{ vars.GFSC_COLLECTION }}
        run: python scripts/fetch_snow_observation.py
      - name: Upload static observation
        uses: actions/upload-artifact@v4
        with:
          name: snow-observation-${{ github.run_id }}
          path: data/generated/observations/sierra-nevada/latest/
          if-no-files-found: error
          retention-days: 14
      - name: Add observation to web build
        run: |
          mkdir -p frontend/public/data/observations/latest
          cp data/generated/observations/sierra-nevada/latest/manifest.json frontend/public/data/observations/latest/
          cp data/generated/observations/sierra-nevada/latest/snow_cover.png frontend/public/data/observations/latest/
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy updated observation
        id: deployment
        uses: actions/deploy-pages@v4
