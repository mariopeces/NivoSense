<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, system-ui, sans-serif">
  <!-- Webcam map symbol spec for T3.4. Geometry is symbolic (θ, φ, r): no real camera's values are drawn.
       Colours are tokens.json values: ink #17202B, accent #E0703F, text-muted #5A6573, halo #FFFFFF, panel-soft #F3F5F8. -->
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#17202B" font-family="'Source Serif 4', Georgia, serif">Símbolo de webcam en el mapa</text>
  <text x="32" y="70" font-size="14" fill="#5A6573">Cono construido en el cliente a partir de rumbo θ (grados desde el norte, sentido horario), campo de visión φ y alcance r de backend/webcam_overrides.json (T3.3).</text>

  <!-- Geometry -->
  <g transform="translate(250 330)">
    <line x1="0" y1="0" x2="0" y2="-210" stroke="#5A6573" stroke-dasharray="4 4"/>
    <text x="6" y="-214" font-size="13" fill="#5A6573">N</text>
    <!-- cone: θ = 60°, φ = 60° here only to draw the parameters -->
    <path d="M0 0 L103 -178.4 A206 206 0 0 1 206 0 Z" fill="#17202B" fill-opacity="0.14" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 0 L103 -178.4 A206 206 0 0 1 206 0 Z" fill="none" stroke="#17202B" stroke-width="1.25" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="178.4" y2="-103" stroke="#17202B" stroke-dasharray="2 4"/>
    <path d="M0 -70 A70 70 0 0 1 60.6 -35" fill="none" stroke="#E0703F" stroke-width="1.5"/>
    <text x="24" y="-80" font-size="16" fill="#B5502A" font-weight="600">θ</text>
    <path d="M60 -103.9 A120 120 0 0 1 120 0" fill="none" stroke="#17202B" stroke-width="1.5"/>
    <text x="112" y="-78" font-size="16" fill="#17202B" font-weight="600">φ</text>
    <text x="150" y="20" font-size="16" fill="#17202B" font-weight="600">r</text>
    <circle r="12" fill="#17202B" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="0" x2="7" y2="-4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g font-size="13" fill="#17202B">
    <text x="32" y="400">• Cono: relleno ink al 14 %, trazo ink 1,25 px sobre halo blanco 4 px.</text>
    <text x="32" y="422">• Disco: ink, radio 12 px, halo blanco 2 px; marca de dirección hacia θ.</text>
    <text x="32" y="444">• El arco se dibuja como polígono de 32 segmentos; r en km sobre el terreno.</text>
    <text x="32" y="466">• Orden de capas: conos bajo todos los discos; el seleccionado encima.</text>
  </g>

  <!-- States -->
  <g transform="translate(560 120)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#17202B">Estados</text>
    <!-- rest -->
    <g transform="translate(20 60)">
      <path d="M0 0 L50 -40 A64 64 0 0 1 62 14 Z" fill="#17202B" fill-opacity="0.14" stroke="#17202B" stroke-width="1.25"/>
      <circle r="12" fill="#17202B" stroke="#FFFFFF" stroke-width="2"/><line x1="0" y1="0" x2="7" y2="-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="90" y="-6" font-size="14" font-weight="600" fill="#17202B">Reposo</text>
      <text x="90" y="14" font-size="13" fill="#5A6573">Con imagen y orientación verificada.</text>
    </g>
    <!-- hover -->
    <g transform="translate(20 140)">
      <path d="M0 0 L50 -40 A64 64 0 0 1 62 14 Z" fill="#17202B" fill-opacity="0.26" stroke="#17202B" stroke-width="2"/>
      <circle r="13" fill="#17202B" stroke="#FFFFFF" stroke-width="2"/><line x1="0" y1="0" x2="7" y2="-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="90" y="-6" font-size="14" font-weight="600" fill="#17202B">Hover o foco</text>
      <text x="90" y="14" font-size="13" fill="#5A6573">Cono más opaco y trazo 2 px; tooltip con nombre y edad.</text>
    </g>
    <!-- selected -->
    <g transform="translate(20 220)">
      <path d="M0 0 L50 -40 A64 64 0 0 1 62 14 Z" fill="#17202B" fill-opacity="0.26" stroke="#E0703F" stroke-width="2"/>
      <circle r="16" fill="none" stroke="#E0703F" stroke-width="2"/>
      <circle r="12" fill="#17202B" stroke="#FFFFFF" stroke-width="2"/><line x1="0" y1="0" x2="7" y2="-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="90" y="-6" font-size="14" font-weight="600" fill="#17202B">Seleccionada</text>
      <text x="90" y="14" font-size="13" fill="#5A6573">Anillo y trazo del cono en accent; la tarjeta queda abierta.</text>
    </g>
    <!-- no bearing -->
    <g transform="translate(20 300)">
      <circle r="12" fill="#17202B" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-5" y="-4" width="10" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="90" y="-6" font-size="14" font-weight="600" fill="#17202B">Con imagen, sin orientación verificada</text>
      <text x="90" y="14" font-size="13" fill="#5A6573">Sin cono y sin marca de dirección: no se dibuja una dirección supuesta.</text>
    </g>
    <!-- offline -->
    <g transform="translate(20 380)">
      <circle r="12" fill="#FFFFFF" stroke="#5A6573" stroke-width="1.5"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#5A6573" stroke-width="1.5" stroke-linecap="round"/>
      <text x="90" y="-6" font-size="14" font-weight="600" fill="#17202B">Sin imagen</text>
      <text x="90" y="14" font-size="13" fill="#5A6573">Disco blanco tachado; el cono, si existe, se oculta. La tarjeta dice "Cámara sin imagen".</text>
    </g>
  </g>
</svg>
