<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NivoSense · maqueta</title>
<!-- Static mockup for the T4.0 design spec. Serve the repo root (python -m http.server) and open
     /docs/design/mockups/index.html?s=<screen>. Screens are listed in docs/design/README.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="app.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <div id="map" role="region" aria-label="Mapa"></div>
  <nav class="rail" aria-label="Secciones">
    <div class="mark" title="NivoSense" aria-hidden="true">N</div>
    <button class="rail-btn" data-section="nieve"><i data-lucide="snowflake"></i><span data-copy="rail.nieve"></span></button>
    <button class="rail-btn" data-section="agua"><i data-lucide="droplets"></i><span data-copy="rail.agua"></span></button>
    <button class="rail-btn" data-section="webcams"><i data-lucide="cctv"></i><span data-copy="rail.webcams"></span></button>
    <button class="rail-btn" data-section="meteo"><i data-lucide="cloud-sun-rain"></i><span data-copy="rail.meteo"></span></button>
    <button class="rail-btn" data-section="metodo"><i data-lucide="book-open-text"></i><span data-copy="rail.metodo"></span></button>
    <div class="rail-spacer"></div>
    <div class="rail-sep"></div>
    <button class="rail-btn foot"><i data-lucide="map"></i><span data-copy="rail.mapa_base"></span></button>
    <button class="rail-btn foot"><i data-lucide="mountain"></i><span data-copy="rail.relieve_3d"></span></button>
    <button class="rail-btn foot" id="collapse"><i data-lucide="panel-left-close"></i><span data-copy="rail.ocultar_panel"></span></button>
  </nav>
  <aside class="panel" id="panel" aria-label="Panel">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="panel-head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="title" id="ptitle"></h1>
      <p class="subtitle" id="psub"></p>
    </div>
    <div class="panel-body" id="pbody"></div>
  </aside>
  <div class="map-controls" aria-label="Controles del mapa">
    <button data-copy-label="mapa.acercar"><i data-lucide="plus"></i></button>
    <button data-copy-label="mapa.alejar"><i data-lucide="minus"></i></button>
    <button data-copy-label="mapa.norte"><i data-lucide="compass"></i></button>
  </div>
  <div class="attribution" id="attribution"></div>
  <div id="overlays"></div>
</div>
<script src="app.js"></script>
</body>
</html>
